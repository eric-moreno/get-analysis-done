wave: 1
description: "Foundation"
clear_context: true

load_artifacts:
  - path: "strategy/ANALYSIS_STRATEGY.md"
    reason: "Approved analysis strategy guiding all foundation work"
  - path: "gate-results/gate-0-to-1-RESULT.json"
    reason: "Gate result confirming strategy completeness"

agents:
  - theory-scout
  - data-explorer
  - detector-specialist
  - lead-analyst

outputs:
