    description: "Theory predictions, existing measurements, and key references"
  - path: "foundation/SAMPLE_INVENTORY.md"
    description: "Available MC and data samples with cross-sections and luminosities"
  - path: "foundation/OBJECT_DEFINITIONS.md"
    description: "Physics object selection criteria (electrons, muons, jets, MET)"
  - path: "gate-results/gate-1-to-2-RESULT.json"
    description: "Gate evaluation result for Wave 1 to Wave 2 transition"
