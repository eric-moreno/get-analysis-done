wave: 2
description: "Event Selection"
clear_context: true

load_artifacts:
  - path: "analysis/wave0/ANALYSIS_STRATEGY.md"
    reason: "Strategy defines signal region cuts and MVA approach"
  - path: "analysis/wave1/SAMPLE_INVENTORY.md"
    reason: "Sample list for cutflow and training inputs"
  - path: "analysis/wave1/OBJECT_DEFINITIONS.md"
    reason: "Object definitions used in event selection"
  - path: "analysis/wave1/theory/literature_review.md"
    reason: "Theory context for selection optimization"
  - path: "gate-results/gate-1-to-2-RESULT.json"
    reason: "Gate result confirming foundation completeness"

agents:
  - signal-lead
  - ml-specialist
  - background-estimator

outputs:
  - path: "analysis/wave2/selection/CUTFLOW.md"
    description: "Event selection cutflow with yields at each stage"
  - path: "analysis/wave2/selection/REGIONS.md"
    description: "Signal and control region definitions"
  - path: "analysis/wave2/mva/BDT_MODEL.md"
    description: "BDT training configuration, features, and performance metrics"
  - path: "gate-results/gate-2-to-3-RESULT.json"
    description: "Gate evaluation result for Wave 2 to Wave 3 transition"
