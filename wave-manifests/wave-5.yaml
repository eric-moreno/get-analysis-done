wave: 5
description: "Pre-Unblinding Review"
clear_context: true

load_artifacts:
  - path: "analysis/wave0/ANALYSIS_STRATEGY.md"
    reason: "Strategy for completeness review"
  - path: "analysis/wave1/theory/literature_review.md"
    reason: "Theory context for note writing"
  - path: "analysis/wave2/selection/CUTFLOW.md"
    reason: "Selection details for analysis note"
  - path: "analysis/wave2/selection/REGIONS.md"
    reason: "Region definitions for analysis note"
  - path: "analysis/wave3/BACKGROUND_YIELDS.md"
    reason: "Background results for analysis note"
  - path: "analysis/wave3/CLOSURE_TESTS.md"
    reason: "Validation results for review"
  - path: "analysis/wave4/systematics/NP_RANKING.md"
    reason: "Systematic impacts for review"
  - path: "analysis/wave4/statmodel/EXPECTED_LIMIT.md"
    reason: "Expected sensitivity for review"
  - path: "analysis/wave4/statmodel/FIT_MODEL.md"
    reason: "Fit model for review"
  - path: "gate-results/gate-4-to-5-RESULT.json"
    reason: "Gate result confirming stat model quality"

agents:
  - note-writer
  - cross-checker
  - lead-analyst

outputs:
  - path: "analysis/wave5/note/ANALYSIS_NOTE_DRAFT.md"
    description: "Draft analysis note with all pre-unblinding content"
  - path: "analysis/wave5/UNBLINDING_CHECKLIST.md"
    description: "Pre-unblinding review checklist with all items checked"
  - path: "analysis/wave5/crosscheck/CROSS_CHECK_SUMMARY.md"
    description: "Summary of all cross-checks performed"
  - path: "gate-results/gate-5-to-6-RESULT.json"
    description: "Gate evaluation result for Wave 5 to Wave 6 transition"
